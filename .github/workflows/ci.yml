name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      API_PORT: ${{secrets.API_PORT}}
      DB_PASSWORD: ${{secrets.DB_PASSWORD}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Build Docker image
        run: docker build -t devops-app ./api

      - name: Show API health logs
        run: docker compose logs api

      - name: Check API heath simple
        run: docker compose ps

      - name: Run docker compose
        run: docker compose up -d

      - name: Wait for API healthy
        run: |
          for i in {1..10}; do
            if docker compose ps | grep -q "api.*healthy"; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done
          echo "API not healthy"
          exit 1

      - name: Wait for nginx
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:8085 > /dev/null; then
              echo "Nginx is up"
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "Nginx failed to start"
          exit 1

      - name: Debug containers
        run: docker ps -a

      - name: Debug nginx logs
        run: docker compose logs nginx

      - name: Check nginx
        run: curl http://localhost:8085

      - name: Deploy to server
        run:
          mkdir -p ~/.ssh
          echo "${{secrets.SSH_KEY}}" > /.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519


          ssh -o StrictHostKeyChecking=no ${{secrets.SSH_USER}}@${{secrets.SSH_HOST}} << 'EOF'
            cd ~/devops-project
            git pull
            docker compose down
            docker compose up -d --build
          EOF
