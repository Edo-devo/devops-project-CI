version: "3.9"

services:
  api:
    build: ./api
    command: python -m http.server 8000
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 10s
      timeout: 3s
      retries: 3

    secrets:
      - db_password

  nginx:
    image: nginx:latest
    ports:
      - "8085:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template
    environment:
      - API_PORT=${API_PORT}
    restart: always

secrets:
  db_password:
    file: ./db_password.txt
